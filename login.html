<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="estilo/login.css">
    <title>login</title>
</head>

<body>
    <main>
        <div class="carro-login">
            <img src="/img/ranger.png" alt="Ranger">
        </div>

        <div class="lado-direito-login">
            <div class="itens-login">

                <div class="logo-login">
                    <img src="img/ford.png" alt="logo-ford" class="logo">
                </div>

                <form action="/login" method="post">

                    <h2 id="texto-principal-login">Boas-vindas</h2>

                    <div class="usuario-formulario">
                        <div class="input-container">
                            <i class="fa-regular fa-user icone-esquerdo"></i>
                            <label for="usuário-login"></label>
                            <input type="email" id="usuário" name="usuário" autocomplete="username"
                                placeholder="Insira seu e-mail" required>
                            <i class="fa-solid fa-circle-info icone-direito"></i>
                        </div>
                    </div>

                    <div class="senha-formulario">
                        <div class="input-container">
                            <i class="fa-solid fa-lock icone-esquerdo"></i>
                            <label for="senha"></label>
                            <input type="password" id="senha" name="senha" autocomplete="current-password"
                                placeholder="Insira sua senha" required>
                            <i class="fa-solid fa-circle-info icone-direito"></i>
                        </div>
                    </div>

                    <div class="opcoes-extras">
                        <span>Logar automaticamente</span>
                        <label class="switch">
                            <input type="checkbox" name="lembrar">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <button type="submit">Entrar</button>
                </form>

            </div>
        </div>
    </main>
</body>

</html>
